<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetic – Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg: #0D0D0D;
      --color-surface: #1A1A1A;
      --color-border: #2a2a2a;
      --color-primary: #E8FF47;
      --color-primary-dim: #c8df2a;
      --color-text: #FFFFFF;
      --color-text-muted: #888888;
      --color-error: #FF5C5C;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-full: 9999px;
      --font: 'Inter', system-ui, sans-serif;
    }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav {
      width: 100%;
      max-width: 480px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-back {
      width: 40px; height: 40px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none; color: var(--color-text);
      font-size: 18px;
    }
    .nav-title { font-size: 16px; font-weight: 600; }

    .form-container {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px 0;
      flex: 1;
    }

    /* Logo centered */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--color-primary);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 20px; height: 20px; }
    .logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

    .form-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
    .form-subtitle { font-size: 14px; color: var(--color-text-muted); margin-bottom: 36px; }

    .field { margin-bottom: 20px; }
    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-muted);
      margin-bottom: 8px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field-input {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 15px;
      color: var(--color-text);
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
    }
    .field-input::placeholder { color: #555; }
    .field-input:focus { border-color: var(--color-primary); }

    .field-input.error { border-color: var(--color-error); }
    .field-error { font-size: 12px; color: var(--color-error); margin-top: 6px; }

    /* Password row with show/hide */
    .password-wrapper { position: relative; }
    .password-wrapper .field-input { padding-right: 48px; }
    .show-hide {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--color-text-muted); font-size: 14px;
      font-family: var(--font);
    }

    .forgot-row {
      display: flex; justify-content: flex-end;
      margin-top: -12px; margin-bottom: 28px;
    }
    .forgot-link {
      font-size: 13px; color: var(--color-primary); text-decoration: none;
    }

    /* Remember me */
    .remember-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 32px;
    }
    .checkbox {
      width: 20px; height: 20px; min-width: 20px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .checkbox.checked { background: var(--color-primary); border-color: var(--color-primary); }
    .checkbox.checked::after { content: '✓'; font-size: 13px; color: #000; font-weight: 700; }
    .remember-label { font-size: 14px; color: var(--color-text-muted); }

    .btn-primary {
      width: 100%;
      background: var(--color-primary);
      color: #000;
      border: none;
      border-radius: var(--radius-full);
      padding: 18px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      text-align: center;
      text-decoration: none;
      display: block;
      margin-bottom: 20px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--color-primary-dim); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    .divider-line { flex: 1; height: 1px; background: var(--color-border); }
    .divider-text { font-size: 13px; color: var(--color-text-muted); }

    .btn-social {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: 16px;
      font-size: 14px; font-weight: 600;
      color: var(--color-text);
      cursor: pointer; font-family: var(--font);
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 12px; text-decoration: none;
    }
    .btn-social:hover { border-color: #555; }

    .register-hint {
      text-align: center; font-size: 13px;
      color: var(--color-text-muted);
      padding: 24px 0 48px;
    }
    .register-hint a { color: var(--color-primary); text-decoration: none; }

    /* Error banner */
    .error-banner {
      background: #2a1010;
      border: 1px solid var(--color-error);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--color-error);
      margin-bottom: 24px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .error-banner-icon { font-size: 16px; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="landing.html" class="btn-back">&#8592;</a>
    <span class="nav-title">Sign In</span>
  </nav>

  <div class="form-container">

    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
          <path d="M6 4v16M18 4v16M4 8h4M16 8h4M4 16h4M16 16h4"/>
        </svg>
      </div>
      <span class="logo-text">Kinetic</span>
    </div>

    <h1 class="form-title">Welcome back</h1>
    <p class="form-subtitle">Sign in to continue your training journey.</p>

    <!-- Error state (shown when login fails) -->
    <div class="error-banner" style="display:none;" id="error-banner">
      <span class="error-banner-icon">&#9888;</span>
      <span>Invalid email or password. Please try again.</span>
    </div>

    <div class="field">
      <label class="field-label" for="email">Email Address</label>
      <input id="email" class="field-input" type="email" placeholder="max@example.com" value="max@example.com" />
    </div>

    <div class="field">
      <label class="field-label" for="password">Password</label>
      <div class="password-wrapper">
        <input id="password" class="field-input" type="password" placeholder="Your password" />
        <button class="show-hide" type="button">Show</button>
      </div>
    </div>

    <div class="forgot-row">
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <div class="remember-row">
      <div class="checkbox checked"></div>
      <span class="remember-label">Remember me for 30 days</span>
    </div>

    <a href="../overview/overview.html" class="btn-primary">Sign In</a>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or continue with</span>
      <div class="divider-line"></div>
    </div>

    <a href="#" class="btn-social">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>
    <a href="#" class="btn-social">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 0C4.029 0 0 4.029 0 9c0 3.979 2.579 7.348 6.158 8.541.45.083.614-.195.614-.434 0-.214-.008-.783-.012-1.537-2.504.544-3.033-1.207-3.033-1.207-.409-1.04-1-1.317-1-1.317-.818-.559.062-.548.062-.548.904.063 1.38.928 1.38.928.803 1.376 2.107.978 2.62.748.082-.582.314-.978.571-1.203-1.999-.227-4.103-1-4.103-4.449 0-.982.351-1.785.927-2.414-.093-.227-.402-1.142.088-2.381 0 0 .755-.242 2.475.923A8.626 8.626 0 0 1 9 4.408c.765.004 1.535.103 2.254.302 1.718-1.165 2.472-.923 2.472-.923.491 1.239.182 2.154.089 2.381.577.629.926 1.432.926 2.414 0 3.458-2.107 4.219-4.113 4.44.323.279.611.829.611 1.671 0 1.207-.011 2.179-.011 2.476 0 .241.162.522.619.433C15.424 16.345 18 12.977 18 9c0-4.971-4.029-9-9-9z" fill="#fff"/>
      </svg>
      Continue with GitHub
    </a>

    <p class="register-hint">Don't have an account? <a href="registration.html">Create one</a></p>

  </div>

</body>
</html>
